name: Deploy Inspector

on:
  push:
    branches: [dev, main]
    paths:
      - "inspector/**"
      - "scripts/lib/**"
      - "scripts/upload_inspector.py"
      - "scripts/inspector_v2_seed/**"
      - "data/surah_info.json"
      - "data/qpc_hafs.json"
      - "data/digital_khatt_v2_script.json"
      - "data/phoneme_sub_costs.json"
      - ".dockerignore"
      - ".github/workflows/inspector-deploy.yml"
  workflow_dispatch:
    inputs:
      env:
        description: "Target Space (auto follows the branch: dev→dev, main→prod)."
        type: choice
        options: [auto, dev, prod]
        default: auto

concurrency:
  # Avoid two pushes deploying simultaneously — the Hub upload is idempotent
  # but parallel rebuilds on the Space waste container time.
  group: inspector-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/inspector-checks.yml

  deploy:
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: inspector/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install "huggingface_hub>=1.10"

      - name: Resolve target environment
        id: env
        run: |
          INPUT="${{ inputs.env }}"
          if [ -n "$INPUT" ] && [ "$INPUT" != "auto" ]; then
            echo "env=$INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${GITHUB_REF_NAME}" in
            dev)  echo "env=dev"  >> "$GITHUB_OUTPUT" ;;
            main) echo "env=prod" >> "$GITHUB_OUTPUT" ;;
            *)    echo "env=dev"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/upload_inspector.py "${{ steps.env.outputs.env }}"
