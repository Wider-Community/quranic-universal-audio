name: Deploy Inspector

on:
  push:
    branches: [dev, main]
    paths:
      - "inspector/**"
      - "scripts/lib/**"
      - "scripts/upload_inspector.py"
      - "scripts/inspector_v2_seed/**"
      - "data/surah_info.json"
      - "data/qpc_hafs.json"
      - "data/digital_khatt_v2_script.json"
      - "data/phoneme_sub_costs.json"
      - ".dockerignore"
      - ".github/workflows/inspector-deploy.yml"
  workflow_dispatch:
    inputs:
      env:
        description: "Target Space (auto follows the branch: dev→dev, main→prod)."
        type: choice
        options: [auto, dev, prod]
        default: auto
      verify_boot:
        description: "Build + boot the image and gate the deploy on /healthz (prod only; slow)."
        type: boolean
        default: false

# contents: write is required because the reusable inspector-checks.yml
# frontend-checks job pushes back lint autofixes; a reusable workflow can
# never exceed the caller's grant, so the caller must allow write too.
permissions:
  contents: write

concurrency:
  # Avoid two pushes deploying simultaneously — the Hub upload is idempotent
  # but parallel rebuilds on the Space waste container time.
  group: inspector-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/inspector-checks.yml

  # Opt-in, prod-only: build the image and assert it boots (/healthz) before
  # deploying. Runs ONLY on a manual workflow_dispatch with verify_boot=true
  # targeting prod — normal pushes skip it (a skipped `needs` doesn't block
  # deploy), so automatic deploys stay fast. The image builds the same
  # `context: .` the Space builds, then smoke_boot runs it offline (filesystem
  # fixtures, no secrets) and polls /healthz.
  boot-smoke:
    needs: [checks]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.verify_boot == true &&
      (inputs.env == 'prod' || (inputs.env == 'auto' && github.ref_name == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixtures downloader
        run: pip install "huggingface_hub>=1.10"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: inspector/Dockerfile
          load: true
          tags: inspector-smoke:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Boot smoke test (/healthz)
        run: python inspector/scripts/smoke_boot.py --skip-build --tag inspector-smoke:latest

  deploy:
    needs: [checks, boot-smoke]
    # boot-smoke is skipped on normal pushes; a skipped `needs` would make the
    # default `if: success()` fail and skip deploy too. Run deploy whenever
    # checks passed and boot-smoke did not FAIL (skipped or success both deploy).
    if: >-
      ${{ always() &&
          needs.checks.result == 'success' &&
          needs.boot-smoke.result != 'failure' &&
          needs.boot-smoke.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install "huggingface_hub>=1.10"

      - name: Resolve target environment
        id: env
        run: |
          INPUT="${{ inputs.env }}"
          if [ -n "$INPUT" ] && [ "$INPUT" != "auto" ]; then
            echo "env=$INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${GITHUB_REF_NAME}" in
            dev)  echo "env=dev"  >> "$GITHUB_OUTPUT" ;;
            main) echo "env=prod" >> "$GITHUB_OUTPUT" ;;
            *)    echo "env=dev"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/upload_inspector.py "${{ steps.env.outputs.env }}"
