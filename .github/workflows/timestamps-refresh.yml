name: Refresh Timestamps

on:
  workflow_dispatch:
    inputs:
      reciter:
        description: 'Reciter slug to refresh (blank = auto-detect from recent changes)'
        required: false
      verses:
        description: 'Comma-separated verse keys e.g. 1:1,37:151 (blank = auto-detect from segment diff)'
        required: false
  push:
    branches: [main]
    paths:
      - 'data/recitation_segments/**/segments.json'

permissions:
  contents: write
  issues: write

concurrency:
  group: timestamps-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install numpy requests

      - name: Detect changed reciters and verses
        id: detect
        run: |
          # Manual trigger with explicit reciter/verses
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            reciter="${{ github.event.inputs.reciter }}"
            verses="${{ github.event.inputs.verses }}"
            if [ -n "$reciter" ] && [ -n "$verses" ]; then
              echo "entries=$reciter=$verses" >> $GITHUB_OUTPUT
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "Manual: $reciter verses=$verses"
              exit 0
            fi
          fi

          # Guard: skip if timestamps were also changed in this push
          if [ "${{ github.event_name }}" = "push" ]; then
            ts_changed=$(git diff ${{ github.event.before }}..${{ github.sha }} \
              --name-only -- 'data/timestamps/' | wc -l)
            if [ "$ts_changed" -gt 0 ]; then
              echo "Timestamps also changed in this push — skipping refresh"
              echo "has_changes=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # Auto-detect from git diff
          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          # Find changed segments.json files
          changed_files=$(git diff "$before".."$after" --name-only \
            -- 'data/recitation_segments/*/segments.json' 2>/dev/null || true)

          if [ -z "$changed_files" ]; then
            echo "No segments.json files changed"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          entries=""
          for f in $changed_files; do
            reciter=$(echo "$f" | sed -E 's|data/recitation_segments/([^/]+)/segments.json|\1|')

            # Check if this reciter has tracked timestamps
            ts_exists=false
            for ts_dir in data/timestamps/by_surah_audio data/timestamps/by_ayah_audio; do
              if [ -f "$ts_dir/$reciter/timestamps.json" ]; then
                ts_exists=true
                break
              fi
            done
            if [ "$ts_exists" = "false" ]; then
              echo "Skipping $reciter: no tracked timestamps"
              continue
            fi

            # Detect changed verses
            output=$(python3 .github/scripts/detect_stale_timestamps.py "$before" "$f" 2>/dev/null) || continue
            changed_verses=$(echo "$output" | grep '^changed=' | cut -d= -f2)

            if [ -n "$changed_verses" ]; then
              echo "$reciter: changed=$changed_verses"
              entries="$entries $reciter=$changed_verses"
            fi
          done

          entries=$(echo "$entries" | xargs)
          if [ -z "$entries" ]; then
            echo "No stale timestamps detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "entries=$entries" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Refresh timestamps via MFA
        if: steps.detect.outputs.has_changes == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          for entry in ${{ steps.detect.outputs.entries }}; do
            reciter=$(echo "$entry" | cut -d= -f1)
            verses=$(echo "$entry" | cut -d= -f2)
            echo "::group::Refreshing $reciter (verses: $verses) beams=50,5"
            python3 extract_timestamps.py \
              --input "data/recitation_segments/$reciter/" \
              --space-url "https://hetchyy-quran-phoneme-mfa-dev.hf.space" \
              --beams 50,5 \
              --refresh-verses "$verses"
            echo "::endgroup::"
          done

      - name: Check probe-beam (5) failures on refreshed verses
        id: beamcheck
        if: steps.detect.outputs.has_changes == 'true'
        env:
          ENTRIES: ${{ steps.detect.outputs.entries }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          PROBE_BEAM = 5
          entries_raw = os.environ["ENTRIES"].strip()
          repo = Path(".")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          gh_out = Path(os.environ["GITHUB_OUTPUT"])

          any_failures = False
          summary_lines = ["# Timestamps refresh — probe-beam (5) check\n"]

          def _verse_keys(failure):
              """Yield every (surah, ayah) key the failure's ref touches.

              `verse` field on the failure is the chapter ref ("1" for by-surah
              audio; "1:1" for by-ayah). `ref` is the seg's matched_ref
              (e.g. "37:151:3-37:152:2") which is what we want to intersect
              with the refreshed verse set.
              """
              ref = failure.get("ref", "")
              # Strip Basmala+/Isti'adha+ prefix (rare).
              for prefix in ("Basmala+", "Isti'adha+"):
                  if ref.startswith(prefix):
                      ref = ref[len(prefix):]
              parts = ref.split("-")
              if len(parts) != 2:
                  return
              sp = parts[0].split(":")
              ep = parts[1].split(":")
              if len(sp) < 2 or len(ep) < 2:
                  return
              try:
                  s_sur, s_ayah = int(sp[0]), int(sp[1])
                  e_sur, e_ayah = int(ep[0]), int(ep[1])
              except ValueError:
                  return
              if s_sur == e_sur:
                  for a in range(s_ayah, e_ayah + 1):
                      yield f"{s_sur}:{a}"
              else:
                  yield f"{s_sur}:{s_ayah}"
                  yield f"{e_sur}:{e_ayah}"

          for entry in entries_raw.split():
              reciter, _, verses_csv = entry.partition("=")
              refreshed = {v.strip() for v in verses_csv.split(",") if v.strip()}
              found_dir = None
              for cat in ("by_surah_audio", "by_ayah_audio"):
                  d = repo / "data" / "timestamps" / cat / reciter
                  if (d / "timestamps.json").exists():
                      found_dir = d
                      break
              if found_dir is None:
                  print(f"::warning::No timestamps dir for {reciter}; skipping beamcheck.")
                  continue
              probe = found_dir / f"timestamps_full.beam_{PROBE_BEAM}.json"
              if not probe.exists():
                  print(f"::warning::{reciter}: no probe-beam-{PROBE_BEAM} output "
                        f"({probe.name}). Refresh did not run dual-beam — skipping gate.")
                  summary_lines.append(f"- **{reciter}** ⚠️ probe-beam output missing")
                  continue
              probe_doc = json.loads(probe.read_text(encoding="utf-8"))
              probe_failures = (probe_doc.get("_meta") or {}).get("mfa_failures") or []
              hits = []
              for f in probe_failures:
                  if any(vk in refreshed for vk in _verse_keys(f)):
                      hits.append(f)
              if not hits:
                  summary_lines.append(
                      f"- **{reciter}** ✅ probe-beam clean on refreshed verses "
                      f"(total probe failures elsewhere: {len(probe_failures)})"
                  )
                  continue
              any_failures = True
              summary_lines.append(
                  f"- **{reciter}** 🚫 {len(hits)} probe-beam-{PROBE_BEAM} failures "
                  f"on refreshed verses"
              )
              summary_lines.append("")
              summary_lines.append("  | Verse | Ref | Seg | Error |")
              summary_lines.append("  | --- | --- | --- | --- |")
              for f in hits:
                  summary_lines.append(
                      f"  | `{f.get('verse','?')}` "
                      f"| `{f.get('ref','?')}` "
                      f"| {f.get('seg','?')} "
                      f"| `{f.get('error','?')}` |"
                  )
                  print(
                      f"::error file=data/recitation_segments/{reciter}/segments.json"
                      f"::probe-beam-{PROBE_BEAM} alignment failed for "
                      f"{reciter} verse {f.get('verse','?')} "
                      f"(seg {f.get('seg','?')}, ref {f.get('ref','?')})"
                  )

          summary_path.write_text("\n".join(summary_lines) + "\n", encoding="utf-8")
          with open(gh_out, "a") as fh:
              fh.write(f"has_failures={'true' if any_failures else 'false'}\n")
          PY

      - name: Commit and push
        if: steps.detect.outputs.has_changes == 'true' && steps.beamcheck.outputs.has_failures != 'true'
        run: |
          if git diff --quiet data/timestamps/; then
            echo "No timestamp changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Build commit message with details
          msg="chore(timestamps): refresh MFA for edited segments"
          body="Auto-triggered by segment changes."
          for entry in ${{ steps.detect.outputs.entries }}; do
            reciter=$(echo "$entry" | cut -d= -f1)
            verses=$(echo "$entry" | cut -d= -f2)
            body="$body
          - $reciter ($verses)"
          done

          git add data/timestamps/
          git commit -m "$msg" -m "$body"
          git push

      - name: Update issue labels
        if: steps.detect.outputs.has_changes == 'true' && steps.beamcheck.outputs.has_failures != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find issues with awaiting-timestamps label and update
          issues=$(gh issue list --label "status:awaiting-timestamps" --json number -q '.[].number' 2>/dev/null || true)
          for issue in $issues; do
            gh issue edit "$issue" \
              --remove-label "status:awaiting-timestamps" \
              --add-label "status:completed" 2>/dev/null || true
          done

      - name: Fail on probe-beam (5) regressions
        if: steps.beamcheck.outputs.has_failures == 'true'
        run: |
          echo "::error::Refresh blocked: probe-beam (5) failures on refreshed verses. Timestamps were not committed. See the run summary for details."
          exit 1
