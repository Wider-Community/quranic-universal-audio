name: Timestamps First-Push Comment

on:
  workflow_dispatch:
    inputs:
      reciter:
        description: 'Reciter slug (forces a re-comment for that reciter)'
        required: true
      audio_category:
        description: 'by_surah_audio or by_ayah_audio'
        required: true
        default: 'by_surah_audio'
  push:
    branches: [main]
    paths:
      - 'data/timestamps/**/timestamps.json'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: timestamps-first-push-comment
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml numpy

      - name: Detect first-push reciters
        id: detect
        run: |
          set -euo pipefail
          entries=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            entries="${{ github.event.inputs.audio_category }}/${{ github.event.inputs.reciter }}"
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            # Status A = newly added; we only want first pushes.
            added=$(git diff --name-status "$before".."$after" -- \
              'data/timestamps/*/*/timestamps.json' \
              | awk '$1 == "A" { print $2 }')
            for path in $added; do
              # path: data/timestamps/<category>/<reciter>/timestamps.json
              cat=$(echo "$path" | cut -d/ -f3)
              rec=$(echo "$path" | cut -d/ -f4)
              # Skip if same reciter already had timestamps in the OTHER
              # audio category before this push (avoids re-comment on
              # by_ayah_audio ↔ by_surah_audio migrations).
              other="by_ayah_audio"
              [ "$cat" = "by_ayah_audio" ] && other="by_surah_audio"
              if git cat-file -e "$before:data/timestamps/$other/$rec/timestamps.json" 2>/dev/null; then
                echo "Skipping $rec: existed at $other before this push"
                continue
              fi
              entries="$entries $cat/$rec"
            done
            entries=$(echo "$entries" | xargs || true)
          fi

          if [ -z "$entries" ]; then
            echo "has_entries=false" >> $GITHUB_OUTPUT
          else
            echo "has_entries=true" >> $GITHUB_OUTPUT
            echo "entries=$entries" >> $GITHUB_OUTPUT
          fi

      - name: Validate, find PR, and post comment
        if: steps.detect.outputs.has_entries == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- timestamps-validation -->'
          for entry in ${{ steps.detect.outputs.entries }}; do
            cat=$(echo "$entry" | cut -d/ -f1)
            rec=$(echo "$entry" | cut -d/ -f2)
            ts_dir="data/timestamps/$cat/$rec"
            echo "::group::Validating $rec ($cat)"
            python3 validators/validate_timestamps.py "$ts_dir" --json \
              > /tmp/stats.json
            python3 scripts/render_timestamps_validation_comment.py \
              --reciter "$rec" \
              --audio-category "$cat" \
              --stats /tmp/stats.json \
              --out /tmp/comment.md
            cat /tmp/comment.md
            echo "::endgroup::"

            pr=$(python3 scripts/find_segments_pr.py "$rec" || true)
            if [ -z "$pr" ]; then
              echo "::warning::No segments PR found for reciter '$rec' — skipping comment."
              continue
            fi
            echo "Posting validation comment on PR #$pr for $rec"

            existing=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" \
              --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" \
              | head -1 || true)
            if [ -n "$existing" ]; then
              gh api --method PATCH \
                "repos/${{ github.repository }}/issues/comments/${existing}" \
                -f body="$(cat /tmp/comment.md)" >/dev/null
              echo "Updated existing comment $existing on PR #$pr"
            else
              gh pr comment "$pr" --body-file /tmp/comment.md
              echo "Posted new comment on PR #$pr"
            fi
          done
