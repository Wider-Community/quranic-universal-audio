name: Sync HF Dataset

on:
  workflow_dispatch:
    inputs:
      reciter:
        description: 'Reciter slug (blank = all eligible reciters)'
        required: false
      full_rebuild:
        description: 'Force full audio re-download (skip smart reuse)'
        type: boolean
        default: false
      readme_only:
        description: 'Only update dataset README (no reciter data)'
        type: boolean
        default: false
      timestamps_only:
        description: 'Skip the verse-row dataset rebuild + catalog refresh; only push timestamp shards + manifest + resources'
        type: boolean
        default: false
      email_to:
        description: 'Override recipient for the publication email (test mode). Leave blank to use the configured requester address.'
        required: false
      skip_email:
        description: 'Skip the publication email entirely'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'data/timestamps/**/*.json'
      - 'data/audio/**/*.json'

permissions:
  contents: read

concurrency:
  group: sync-dataset
  cancel-in-progress: false

jobs:
  sync-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for before..after diff

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python dependencies
        run: pip install "datasets>=3.0,<4.0" huggingface_hub pydub soundfile pyyaml

      - name: Detect changed reciters
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            reciter="${{ github.event.inputs.reciter }}"
            if [ -n "$reciter" ]; then
              eligible="$reciter"
            else
              eligible=$(python -c "
          import sys; sys.path.insert(0, '.github/scripts')
          from build_reciter import find_eligible_reciters
          print(' '.join(find_eligible_reciters()))
          ")
            fi
            deleted=""
          else
            # Push trigger: detect from git diff
            changed=$(git diff ${{ github.event.before }}..${{ github.sha }} --name-only | \
              grep -E "data/(timestamps|recitation_segments|audio)/" | \
              sed -E 's|data/timestamps/[^/]+/([^/]+)/.*|\1|; s|data/recitation_segments/([^/]+)/.*|\1|; s|data/audio/[^/]+/[^/]+/([^/]+)\.json|\1|' | \
              sort -u | tr '\n' ' ')

            # Filter to only eligible reciters (must have timestamps)
            eligible=""
            for slug in $changed; do
              if [ -f "data/timestamps/by_ayah_audio/$slug/timestamps.json" ] || \
                 [ -f "data/timestamps/by_surah_audio/$slug/timestamps.json" ]; then
                eligible="$eligible $slug"
              fi
            done
            eligible=$(echo "$eligible" | xargs)

            # Detect deleted timestamp dirs
            deleted=$(git diff ${{ github.event.before }}..${{ github.sha }} --diff-filter=D --name-only | \
              grep "data/timestamps/" | \
              sed -E 's|data/timestamps/[^/]+/([^/]+)/.*|\1|' | \
              sort -u | tr '\n' ' ')
          fi

          echo "slugs=$(echo $eligible | xargs)" >> $GITHUB_OUTPUT
          echo "deleted=$(echo $deleted | xargs)" >> $GITHUB_OUTPUT
          echo "Changed reciters: $eligible"
          echo "Deleted reciters: $deleted"

      - name: Build and upload changed reciters
        if: |
          steps.detect.outputs.slugs != ''
          && github.event.inputs.readme_only != 'true'
          && github.event.inputs.timestamps_only != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          flags=""
          if [ "${{ github.event.inputs.full_rebuild }}" = "true" ]; then
            flags="--full-rebuild"
          fi
          for slug in ${{ steps.detect.outputs.slugs }}; do
            echo "Building $slug..."
            python .github/scripts/build_reciter.py $flags "$slug"
          done

      - name: Delete removed reciters
        if: |
          steps.detect.outputs.deleted != ''
          && github.event.inputs.readme_only != 'true'
          && github.event.inputs.timestamps_only != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          for slug in ${{ steps.detect.outputs.deleted }}; do
            echo "Deleting $slug..."
            python .github/scripts/build_reciter.py --delete "$slug"
          done

      - name: Rebuild reciters catalog
        if: github.event.inputs.timestamps_only != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/build_reciter.py --reciters-config

      # ---------------------------------------------------------------------
      # Timestamps-tab read path: per-chapter shards + global resources +
      # manifest. The Inspector frontend (HF mode) reads these directly.
      # Steps run regardless of `readme_only` since manifest + resources
      # may need to refresh independently of reciter dataset rows.
      # ---------------------------------------------------------------------

      - name: Build and upload timestamp shards
        if: steps.detect.outputs.slugs != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          for slug in ${{ steps.detect.outputs.slugs }}; do
            echo "Building timestamp shards for $slug..."
            python .github/scripts/build_reciter.py --build-timestamps "$slug"
          done

      - name: Build and upload global resources
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/build_reciter.py --build-resources

      - name: Build and push manifest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/build_reciter.py --build-manifest

      - name: Email requesters of publication
        if: |
          success()
          && steps.detect.outputs.slugs != ''
          && github.event.inputs.readme_only != 'true'
          && github.event.inputs.timestamps_only != 'true'
          && github.event.inputs.skip_email != 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_REQUESTS_DB_ID: ${{ secrets.NOTION_REQUESTS_DB_ID }}
        run: |
          override="${{ github.event.inputs.email_to }}"
          flags=""
          if [ -n "$override" ]; then
            flags="$flags --to $override"
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            flags="$flags --first-publish-only --before-ref ${{ github.event.before }}"
          fi
          for slug in ${{ steps.detect.outputs.slugs }}; do
            echo "Notifying for $slug..."
            python3 .github/scripts/send_publish_email.py --reciter "$slug" $flags
          done
