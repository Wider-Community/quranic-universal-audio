name: Bucket validate (nightly)

# Steady-state drift guard: validates the external bucket files (catalog,
# audio-manifest sidecars, per-reciter artefacts) + the DB catalog snapshot
# against the schemas. Runs nightly and on demand; a non-zero exit from
# validate_bucket fails the job (and thus alerts). Read-only — no writes.

on:
  schedule:
    # ~06:00 UTC nightly.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bucket-validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            inspector/requirements.txt
            inspector/requirements-dev.txt

      - name: Install deps
        run: pip install -r inspector/requirements.txt -r inspector/requirements-dev.txt

      - name: Validate dev bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          INSPECTOR_AUTO_MOUNT: '0'
        run: python scripts/diagnostics/validate_bucket.py --bucket dev

      - name: Validate prod bucket
        # INSPECTOR_ALLOW_PROD_BUCKET gates prod reads; safe here since the
        # validator is read-only. A non-zero exit fails the job.
        continue-on-error: false
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          INSPECTOR_ALLOW_PROD_BUCKET: '1'
          INSPECTOR_AUTO_MOUNT: '0'
        run: python scripts/diagnostics/validate_bucket.py --bucket prod
