{% extends "base.html" %}
{% block subject %}New release: {{ version }}{% endblock %}
{% block content %}
<p style="margin:0 0 12px;font-size:15px;line-height:1.6;">
  A new release — <strong>{{ version }}</strong> — has been published.
</p>
<p style="margin:0;font-size:15px;line-height:1.6;">
  <a href="{{ gh_releases_url }}" style="color:#5fd0e0;text-decoration:none;">View the release on GitHub</a>
</p>
{% endblock %}
