<!doctype html>
<html lang="en">

  <div style="max-width:520px;margin:0 auto;background:#16213e;border:1px solid #2a3a5e;border-radius:10px;padding:28px;">
    <p style="margin:0 0 16px;font-size:15px;">Assalamu Alaikum,</p>

    <hr style="border:none;border-top:1px solid #2a3a5e;margin:24px 0 16px;">

      You're receiving this because you subscribed to notifications for this address.
      <br>
      <a href="{{ manage_url }}" style="color:#8a8aa0;">Manage preferences</a>
      &nbsp;·&nbsp;
