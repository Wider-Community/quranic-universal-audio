# Root ruff.toml — lint + format for inspector/, qua_shared/, qua_jobs/, scripts/
# Conservative initial ruleset chosen to be GREEN after one autofix+format pass.
# Tool: ruff 0.15.x. Run: `ruff check . && ruff format --check .`

target-version = "py311"
line-length = 100

# Generated / vendored / embedded trees never linted.
# (.local, .claude, node_modules, and the two embedded repos are already
#  gitignored/untracked, but we exclude explicitly so a manual `ruff check <path>`
#  or an editor integration never trips on them.)
extend-exclude = [
    "inspector/frontend",            # TS/Svelte SPA + node build output
    "inspector/frontend/src/lib/types/generated",  # codegen'd (belt-and-suspenders)
    ".local",
    ".claude",
    "node_modules",
]

[lint]
# E  pycodestyle errors   F  pyflakes (real bugs: unused/undefined/redefined)
# I  isort                UP pyupgrade (py311 idioms)   B  flake8-bugbear
select = ["E", "F", "I", "UP", "B"]

# Deliberately ignored for the initial rollout (high-volume, low-signal, or
# intentional in this codebase). Revisit/remove in a later tightening pass.
ignore = [
    "E501",  # line-too-long: 126 hits, mostly long strings/URLs; formatter wraps code, leave prose long.
    "E402",  # module-import-not-at-top: app.py & flat-import scripts set sys.path / env before importing (intentional).
    "E701",  # multiple-statements-on-one-line (colon)
    "E702",  # multiple-statements-on-one-line (semicolon)
    "UP042", # str-Enum → StrEnum: the (str, Enum) bases are the wire/JSON contract for the
             # codegen'd FE types under qua_shared/schemas/; switching to StrEnum changes member
             # str() repr and is a schema migration (needs codegen regen), not a lint autofix.
]

[lint.isort]
# Treat first-party packages as local so import grouping is stable.
known-first-party = ["qua_shared", "qua_jobs", "services", "config", "domain", "adapters", "utils", "constants"]

[lint.per-file-ignores]
# Tests may shadow/redefine fixtures and leave intentionally-unused imports.
"inspector/tests/**" = ["F811", "F401"]
# Package re-export hubs intentionally re-export names.
"**/__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
